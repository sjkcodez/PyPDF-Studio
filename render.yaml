services:
  - type: web
    name: pypdf-studio
    env: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ---- Admin / security ----
      - key: PYPDF_ADMIN_USER
        value: admin
      - key: PYPDF_ADMIN_PASS
        sync: false                 # set in Render dashboard
      - key: PYPDF_SECRET_KEY
        generateValue: true
      - key: PYPDF_RATE_LIMIT
        value: "30"
      - key: PYPDF_FORCE_HTTPS
        value: "1"

      # ---- Misc ----
      - key: PDF_FORCE_LIBREOFFICE
        value: "0"
      - key: PORT
        value: "10000"

      # ---- Google Sheets persistence ----
      - key: GOOGLE_CREDS
        sync: false                 # paste service-account JSON in dashboard
      - key: SHEET_ID
        sync: false                 # paste spreadsheet ID in dashboard
