services:
  - type: web
    name: pypdf-studio
    env: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --timeout 300 --bind 0.0.0.0:$PORT app:app"
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PDF_FORCE_LIBREOFFICE
        value: "0"
