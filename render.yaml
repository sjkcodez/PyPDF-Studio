services:
  - type: web
    name: pypdf-studio
    env: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ---- Admin / security ----
      - key: PYPDF_ADMIN_USER
        value: admin
      - key: PYPDF_ADMIN_PASS
        sync: false
      - key: PYPDF_SECRET_KEY
        generateValue: true
      - key: PYPDF_RATE_LIMIT
        value: "30"
      - key: PYPDF_FORCE_HTTPS
        value: "1"

      # ---- Misc ----
      - key: PDF_FORCE_LIBREOFFICE
        value: "0"
      - key: PORT
        value: "10000"

      # ---- Timezone ----
      - key: TZ
        value: "Africa/Dar_es_Salaam"

      # ---- Google Sheets persistence ----
      - key: GOOGLE_CREDS_FILE
        value: /etc/secrets/gcp-sa.json
      - key: SHEET_ID
        sync: false
